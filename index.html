<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terranova Pet — Identificação &amp; Memorial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-poetic { font-family: 'Playfair Display', serif; }
    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .pulse-alert { animation: pulseAlert 2s infinite ease-in-out; }
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-1deg); opacity: 0.95; filter: drop-shadow(0 0 10px rgba(230, 126, 34, 0.7)); }
      25% { transform: scale(1.08, 0.96) rotate(1deg); opacity: 1; filter: drop-shadow(0 0 14px rgba(243, 156, 18, 0.9)); }
      50% { transform: scale(0.95, 1.05) rotate(-2deg); opacity: 0.9; filter: drop-shadow(0 0 8px rgba(207, 113, 31, 0.7)); }
      75% { transform: scale(1.04, 0.98) rotate(1.5deg); opacity: 0.98; filter: drop-shadow(0 0 12px rgba(235, 152, 78, 0.8)); }
    }
    .flame-animation { animation: flameFlicker 1.8s infinite ease-in-out; transform-origin: bottom center; }
  </style>
</head>
<body class="antialiased min-h-screen bg-[#FBF9F5]">

  <div id="appContainer">
    <!-- Renderizado dinamicamente via app.js -->
  </div>

  <!-- MODAL DO TUTOR PARA EDITAR CONTATOS (CÃO VIVO) -->
  <div id="modalEdicaoTutor" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b border-stone-200 pb-3">
        <h3 class="font-bold text-[#384852] text-sm flex items-center gap-2">
          <span>⚙️</span> Atualizar Meus Telefones e Informações
        </h3>
        <button onclick="fecharModalEdicao()" class="text-stone-400 hover:text-stone-700 text-lg font-bold">&times;</button>
      </div>

      <form onsubmit="salvarEdicaoTutor(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-stone-700 mb-1">Telefone Principal (Ligação Direta) *</label>
          <input type="tel" id="editTelefone" required class="w-full bg-[#FAF7F2] border border-[#DDD4C5] rounded-xl px-3 py-2 text-stone-800 focus:outline-none focus:border-[#E67E22]">
        </div>

        <div>
          <label class="block font-semibold text-stone-700 mb-1">WhatsApp (DDD + Número) *</label>
          <input type="tel" id="editWhatsapp" required placeholder="Ex: 38998124455" class="w-full bg-[#FAF7F2] border border-[#DDD4C5] rounded-xl px-3 py-2 text-stone-800 focus:outline-none focus:border-[#E67E22]">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-semibold text-stone-700">Endereço do Pet</label>
            <label class="flex items-center gap-1.5 cursor-pointer text-[11px] text-stone-500">
              <input type="checkbox" id="editExibirEndereco" class="rounded text-[#E67E22] focus:ring-0">
              <span>Exibir na Tag?</span>
            </label>
          </div>
          <input type="text" id="editEndereco" placeholder="Rua, Bairro, Cidade..." class="w-full bg-[#FAF7F2] border border-[#DDD4C5] rounded-xl px-3 py-2 text-stone-800 focus:outline-none focus:border-[#E67E22]">
          <p class="text-[10px] text-stone-400 mt-0.5">Se desmarcado, apenas seu telefone e WhatsApp serão exibidos para quem encontrar o pet.</p>
        </div>

        <div>
          <label class="block font-semibold text-stone-700 mb-1">Cuidados Especiais / Alergias / Medicamentos</label>
          <textarea id="editCuidados" rows="2" placeholder="Ex: É dócil, toma remédio diário, tem alergia..." class="w-full bg-[#FAF7F2] border border-[#DDD4C5] rounded-xl px-3 py-2 text-stone-800 focus:outline-none focus:border-[#E67E22]"></textarea>
        </div>

        <div>
          <label class="block font-semibold text-stone-700 mb-1">Recompensa (Opcional)</label>
          <input type="text" id="editRecompensa" placeholder="Ex: Recompensa-se com gratidão" class="w-full bg-[#FAF7F2] border border-[#DDD4C5] rounded-xl px-3 py-2 text-stone-800 focus:outline-none focus:border-[#E67E22]">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="fecharModalEdicao()" class="px-4 py-2 rounded-xl border border-stone-300 text-stone-600 font-semibold">Cancelar</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-[#E67E22] text-white font-bold hover:bg-[#CF711F]">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let petAtual = null;

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const petId = (params.get("id") || params.get("pet") || params.get("m") || "TN-THOR-3620").toLowerCase().trim();
      
      let lista = [];
      try { lista = JSON.parse(localStorage.getItem("terranova_pets_store_v3")) || []; } catch(e) {}
      
      petAtual = lista.find(p => 
        (p.id && p.id.toLowerCase() === petId) || 
        (p.nfcCode && p.nfcCode.toLowerCase() === petId) || 
        (p.nome && p.nome.toLowerCase() === petId)
      );
      
      if (!petAtual && typeof TerranovaApp !== "undefined" && TerranovaApp.getPets) {
        petAtual = TerranovaApp.getPetById(petId) || TerranovaApp.getPets()[0];
      }

      if (!petAtual) {
        petAtual = {
          id: petId,
          status: "vivo",
          tipo: "coleira",
          nome: "Thor",
          raca: "Golden Retriever",
          nfcCode: "TN-THOR-3620",
          tutorNome: "Família Miranda",
          tutorTelefone: "(38) 99812-4455",
          tutorWhatsapp: "5538998124455",
          fotoPrincipal: "https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=400&q=80",
          exibirEndereco: true,
          tutorEndereco: "Rua das Flores, 123 - Montes Claros - MG",
          cuidadosMedicos: "Muito dócil, atende pelo nome. Se me encontrar, avise minha família!"
        };
      }

      // Garante que a página da tag de coleira sempre renderize os dados de identificação e resgate
      renderizarPaginaColeira(petAtual);
    });

    function renderizarPaginaColeira(pet) {
      const container = document.getElementById("appContainer");
      document.title = `Terranova Pet — Tag de Identificação de ${pet.nome}`;
      document.body.className = "antialiased min-h-screen bg-[#F4F6F8]";

      const whatsDigits = (pet.tutorWhatsapp || pet.tutorTelefone || "").replace(/\D/g, "");
      const telDigits = (pet.tutorTelefone || "").replace(/\D/g, "");
      const mensagemWhats = encodeURIComponent(`Olá! Encontrei o(a) ${pet.nome} através da tag da coleira Terranova Pet. Estou com ele(a) aqui, podemos combinar a entrega?`);

      container.innerHTML = `
        <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between relative pb-12">
          
          <!-- CABEÇALHO DO PLANO TERRANOVA PET COM LOGO E NAVEGAÇÃO INTEGRADA -->
          <header class="bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 text-[#740568] p-3.5 flex items-center justify-between shadow-md border-b-2 border-[#740568]/20">
            <div class="flex items-center gap-2.5">
              <div class="w-10 h-10 rounded-xl overflow-hidden border border-[#740568]/30 bg-[#740568] p-0.5 flex-shrink-0 shadow-sm">
                <img src="logo_terranova.png" alt="Terranova Pet" class="w-full h-full object-cover rounded-lg">
              </div>
              <div>
                <h1 class="font-bold text-sm tracking-tight leading-tight text-[#740568]">Terranova Pet</h1>
                <p class="text-[10px] text-[#740568]/80 font-bold">Tag Inteligente &bull; Identificação e Resgate</p>
              </div>
            </div>
            <div class="flex items-center">
              <span class="px-3 py-1 rounded-full bg-[#740568] text-yellow-300 font-black text-[10px] uppercase tracking-wider shadow-xs">
                🚨 Pet Perdido
              </span>
            </div>
          </header>

          <main class="p-5 space-y-5 flex-1">
            
            <!-- ALERTA VISUAL DE LOCALIZAÇÃO E RESGATE -->
            <div class="bg-purple-50/70 border-2 border-[#740568]/40 rounded-2xl p-4 text-center shadow-sm">
              <span class="inline-block text-2xl mb-1">📢</span>
              <h2 class="text-sm font-black text-[#740568] uppercase tracking-wide">
                Se você me encontrou, avise minha família!
              </h2>
              <p class="text-xs text-stone-600 mt-0.5 leading-relaxed">
                Estou longe de casa e com saudades. Por favor, entre em contato imediatamente pelos botões abaixo:
              </p>
            </div>

            <!-- FOTO DO PET & NOME -->
            <div class="text-center space-y-2.5">
              <div class="w-36 h-36 rounded-full mx-auto p-1.5 border-4 border-[#740568] bg-white shadow-xl overflow-hidden">
                <img src="${pet.fotoPrincipal || 'https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=400&q=80'}" alt="${pet.nome}" class="w-full h-full object-cover rounded-full">
              </div>
              <div>
                <h3 class="text-3xl font-black font-poetic text-amber-500 tracking-tight leading-none">${pet.nome}</h3>
                <p class="text-xs text-stone-500 font-bold mt-1">${pet.raca || "Companheiro Leal"}</p>
                <div class="mt-1.5">
                  <span class="inline-block bg-purple-50 text-[#740568] px-3 py-1 rounded-full text-xs font-mono font-bold border border-purple-200">
                    Tag NFC: <strong>${pet.nfcCode || ("TN-" + (pet.nome || "PET").toUpperCase() + "-3620")}</strong>
                  </span>
                </div>
              </div>
            </div>

            <!-- BOTÕES PRINCIPAIS DE AÇÃO IMEDIATA (LIGAR / WHATSAPP / GPS) -->
            <div class="space-y-2.5 pt-1">
              ${telDigits ? `
                <a href="tel:${telDigits}" class="w-full py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-md flex items-center justify-center gap-2 transition active:scale-98">
                  <span class="text-lg">📞</span>
                  <span>Ligar para o Tutor: ${pet.tutorTelefone}</span>
                </a>
              ` : ''}

              ${whatsDigits ? `
                <a href="https://api.whatsapp.com/send?phone=${whatsDigits}&text=${mensagemWhats}" target="_blank" class="w-full py-3.5 px-4 rounded-2xl bg-[#25D366] hover:bg-[#1EBE5D] text-white font-black text-sm shadow-md flex items-center justify-center gap-2 transition active:scale-98">
                  <span class="text-lg">💬</span>
                  <span>Chamar no WhatsApp do Tutor</span>
                </a>
              ` : ''}

              <!-- BOTÃO DE ENVIAR LOCALIZAÇÃO GPS -->
              <button type="button" onclick="enviarLocalizacaoGps('${whatsDigits}', '${pet.nome}')" class="w-full py-3 px-4 rounded-2xl bg-white border-2 border-[#E67E22] text-[#E67E22] hover:bg-amber-50 font-bold text-xs shadow-sm flex items-center justify-center gap-2 transition active:scale-98">
                <span>📍</span>
                <span>Enviar Minha Localização GPS para o Tutor</span>
              </button>
            </div>

            <!-- INFORMAÇÕES ADICIONAIS DEFINIDAS PELO TUTOR -->
            <div class="bg-stone-50 border border-stone-200 rounded-2xl p-4 space-y-2.5 text-xs">
              
              <div class="flex items-center justify-between border-b border-stone-200 pb-2">
                <span class="text-stone-500 font-medium">Tutor(a) Responsável:</span>
                <strong class="text-stone-800 font-bold">${pet.tutorNome || "Família Miranda"}</strong>
              </div>

              ${pet.exibirEndereco && pet.tutorEndereco ? `
                <div class="border-b border-stone-200 pb-2">
                  <span class="text-stone-500 font-medium block">Endereço Residencial:</span>
                  <strong class="text-stone-800 font-semibold">${pet.tutorEndereco}</strong>
                </div>
              ` : `
                <div class="border-b border-stone-200 pb-2 text-stone-500 italic text-[11px]">
                  📍 O tutor optou por contato direto por telefone/WhatsApp.
                </div>
              `}

              ${pet.cuidadosMedicos ? `
                <div class="border-b border-stone-200 pb-2">
                  <span class="text-[#E67E22] font-bold block mb-0.5">⚠️ Cuidados / Alergias / Temperamento:</span>
                  <p class="text-stone-700">${pet.cuidadosMedicos}</p>
                </div>
              ` : ""}
            </div>

            <!-- CENTRAL DE ATENDIMENTO TERRANOVA PET -->
            <div class="p-3 rounded-xl bg-orange-50 border border-orange-200 text-center text-[11px] text-stone-600">
              <span>Dificuldade para contatar o tutor? Ligue para o suporte:</span><br>
              <a href="tel:38997263620" class="text-[#E67E22] font-bold hover:underline">Central Terranova Pet: (38) 99726-3620</a>
            </div>

          </main>

          <footer class="text-center pt-2 px-4">
            <a href="gerador.html" class="text-xs text-stone-400 hover:text-[#E67E22] font-medium inline-flex items-center justify-center gap-1 mx-auto transition">
              <span>⚙️</span>
              <span>Abrir Gerador de Páginas &amp; Tags</span>
            </a>
          </footer>

        </div>
      `;
    }


    // Ações de GPS do Cão Perdido
    function enviarLocalizacaoGps(whatsDigits, petNome) {
      if (!navigator.geolocation) {
        alert("Geolocalização não suportada neste dispositivo.");
        return;
      }
      alert("Obtendo sua localização para enviar ao tutor...");
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
          const msg = encodeURIComponent(`Olá! Encontrei o(a) ${petNome} através da plaquinha da coleira Terranova Pet. Minha localização atual no mapa é: ${mapsUrl}`);
          window.open(`https://api.whatsapp.com/send?phone=${whatsDigits}&text=${msg}`, "_blank");
        },
        err => {
          alert("Não foi possível acessar a localização. Por favor, envie uma mensagem normal no WhatsApp.");
        }
      );
    }

    // Modal de Edição dos Dados do Tutor
    function abrirModalEdicao() {
      if (!petAtual) return;
      document.getElementById("editTelefone").value = petAtual.tutorTelefone || "";
      document.getElementById("editWhatsapp").value = petAtual.tutorWhatsapp || "";
      document.getElementById("editExibirEndereco").checked = !!petAtual.exibirEndereco;
      document.getElementById("editEndereco").value = petAtual.tutorEndereco || "";
      document.getElementById("editCuidados").value = petAtual.cuidadosMedicos || "";
      document.getElementById("editRecompensa").value = petAtual.recompensa || "";
      document.getElementById("modalEdicaoTutor").classList.remove("hidden");
    }

    function fecharModalEdicao() {
      document.getElementById("modalEdicaoTutor").classList.add("hidden");
    }

    async function salvarEdicaoTutor(e) {
      e.preventDefault();
      petAtual.tutorTelefone = document.getElementById("editTelefone").value.trim();
      petAtual.tutorWhatsapp = document.getElementById("editWhatsapp").value.trim();
      petAtual.exibirEndereco = document.getElementById("editExibirEndereco").checked;
      petAtual.tutorEndereco = document.getElementById("editEndereco").value.trim();
      petAtual.cuidadosMedicos = document.getElementById("editCuidados").value.trim();
      petAtual.recompensa = document.getElementById("editRecompensa").value.trim();

      await TerranovaApp.savePet(petAtual);
      fecharModalEdicao();
      renderizarPagina(petAtual);
      alert("✅ Seus telefones e preferências foram atualizados na plaquinha com sucesso!");
    }


  </script>
</body>
</html>
